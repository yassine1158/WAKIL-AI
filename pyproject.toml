[project]
name = "yassine-ai"
version = "0.2.0"
description = "Neural networks implemented and trained from scratch with NumPy."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["numpy>=1.24", "matplotlib>=3.7", "scikit-learn>=1.3", "pillow>=9.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
